name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests -v

      - name: Verify Alembic migrations apply cleanly
        env:
          SHADOW_AGENT_DATABASE_PATH: /tmp/ci-migration-check.db
        run: |
          python -m alembic upgrade head
          python -c "import sqlite3; c=sqlite3.connect('/tmp/ci-migration-check.db'); tables=[r[0] for r in c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")]; expected={'alembic_version','alert_events','approval_requests','audit_logs','console_users','intercept_logs','managed_api_keys','replay_runs','security_policies','tool_policies'}; missing=expected-set(tables); assert not missing, f'missing tables: {missing}'; print('migration check OK:', len(tables), 'tables')"

  backend-tests-redis:
    name: Backend tests (shared Redis state)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SHADOW_AGENT_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-redis.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-redis.txt

      - name: Run shared-state tests against live Redis
        run: python -m pytest tests/test_shared_state.py -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t shadowagent-backend-ci ./backend

      - name: Build frontend image
        run: docker build -t shadowagent-frontend-ci ./frontend
